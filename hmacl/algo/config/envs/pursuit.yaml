env: "pursuit"

env_args:
  map_name: "sisl"
  scenario: "pursuit"
  seed: 123
  max_cycles: 500
  x_size: 16
  y_size: 16
  shared_reward: true
  n_evaders: 30
  n_pursuers: 8
  obs_range: 7
  n_catch: 2
  freeze_evaders: false
  tag_reward: 0.01
  catch_reward: 5.0
  urgency_reward: -0.1
  surround: true
  constraint_window: 1.0
  target_map_size: 60
  target_n_pursuers: 20
  scale_n_evaders: false

test_greedy: true
test_nepisode: 32
eval_nepisode: 32
test_interval: 2000
eval_interval: 2000
log_interval: 10000
runner_log_interval: 10000
learner_log_interval: 10000
t_max: 4000000
